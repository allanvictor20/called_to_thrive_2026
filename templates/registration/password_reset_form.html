{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block content %}<div class="narrow"><h1>Reset your password</h1>
<p>We send reset links only to verified email addresses.</p>
<form method="post" class="card">{% csrf_token %}
<div class="field"><label for="id_email">Email address</label><input id="id_email" type="email" name="email" required autocomplete="email"></div>
<button class="btn">Send reset link</button></form></div>{% endblock %}
